[project]
name = "elysium"
version = "2.0.0-alpha"
description = "Elysium — 爱莉的家。数字生命系统：意识、学习、记忆、技能、具身体验。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "anthropic>=0.57.1",
    "async-lru>=2.1.0",
    "asyncmy>=0.2.11",
    "asyncpg>=0.31.0",
    "brotli>=1.1.0",
    "chromadb>=1.4.1",
    "fastapi>=0.128.0",
    "imageio-ffmpeg>=0.6.0",
    "json-repair>=0.57.1",
    "lark-oapi==1.6.8",
    "mcp>=1.26.0",
    "mofox-wire>=0.1.7",
    "openai>=2.16.0",
    "packaging>=26.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.12.5",
    "pyfiglet>=1.0.4",
    "rich>=14.3.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "tiktoken>=0.12.0",
    "websockets>=14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.0.1",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
timeout = 30
addopts = [
    "-n", "auto",
    "--dist", "loadfile",
    "--cov=src",
    "--cov=plugins",
    "--cov-config=pyproject.toml",
    "--cov-report=term-missing",
    "--cov-fail-under=40",
    "--import-mode=importlib",
    "--strict-markers",
]
markers = [
    "slow: 标记慢测试（>1s），CI 中可排除",
    "integration: 需要外部依赖（DB/网络）的集成测试",
]
filterwarnings = [
    "ignore::DeprecationWarning:audioop",
]

[tool.coverage.run]
source = ["src", "plugins"]

[tool.coverage.report]
omit = [
    "test/*",
    "tests/*",
    "examples/*",
    "docs/*",
    "old/*",
    "scripts/*",
    "data/*",
    "logs/*",
    "htmlcov/*",
    "config/*",
    "**/__pycache__/*",
]

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>爱莉通话 · OBS Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f3f6ff;font-family:"Segoe UI",system-ui,sans-serif}.wrap{height:100%;display:grid;place-items:center}.card{width:min(760px,90vw);padding:26px;border-radius:28px;background:linear-gradient(145deg,rgba(12,16,31,.9),rgba(22,29,51,.82));border:1px solid rgba(160,185,255,.28);box-shadow:0 24px 80px rgba(0,0,0,.35);display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}.orb{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#536993,#253555 42%,#0e1427 76%);border:2px solid #7788ae;box-shadow:0 0 50px rgba(126,164,255,.25);transition:.2s}.orb.listening{border-color:#82deb0;box-shadow:0 0 58px rgba(130,222,176,.3)}.orb.thinking{border-color:#f3cf8c}.orb.speaking{border-color:#8bb2ff;animation:pulse 1.1s ease-in-out infinite}.orb.error{border-color:#ff8fa3}@keyframes pulse{50%{transform:scale(1.05)}}.state{text-align:center;font-size:14px}.copy{min-width:0}.name{font-size:13px;letter-spacing:.16em;color:#aab8d8;margin-bottom:14px}.line{font-size:25px;line-height:1.45;text-wrap:balance;min-height:72px}.meta{font-size:12px;color:#8290b1;margin-top:13px}.offline{opacity:.6}@media(max-width:600px){.card{grid-template-columns:1fr;text-align:center}.orb{margin:auto}.line{font-size:20px}}
</style>
</head>
<body><main class="wrap"><section class="card offline" id="card"><div class="orb" id="orb"><span class="state" id="state">等待通话</span></div><div class="copy"><div class="name">ELYSIA · LIVE VOICE</div><div class="line" id="line">实时通话尚未开始</div><div class="meta" id="meta">OBS Browser Source · Transparent overlay</div></div></section></main>
<script>
const base=location.pathname.replace(/\/overlay\/?$/,''),card=document.getElementById('card'),orb=document.getElementById('orb'),stateEl=document.getElementById('state'),line=document.getElementById('line'),meta=document.getElementById('meta');let ws,audioCtx,next=0,sources=new Set();const labels={listening:'正在听',thinking:'正在想',speaking:'正在说',interrupted:'已打断',connecting:'连接中',error:'异常',closed:'结束'};
async function ticket(){const r=await fetch(base+'/ticket',{method:'POST',cache:'no-store'});if(!r.ok)throw new Error('ticket');return(await r.json()).ticket}
function clearAudio(){for(const s of sources){try{s.stop()}catch{}}sources.clear();next=audioCtx?audioCtx.currentTime+.01:0}
async function play(buf){audioCtx=audioCtx||new AudioContext({latencyHint:'interactive'});if(audioCtx.state==='suspended')await audioCtx.resume();const v=new DataView(buf);if(buf.byteLength<16||v.getUint8(0)!==86||v.getUint8(1)!==76||v.getUint8(2)!==49)return;const rate=v.getUint32(8,true),pcm=new Int16Array(buf,16),f=new Float32Array(pcm.length);for(let i=0;i<pcm.length;i++)f[i]=pcm[i]/32768;const b=audioCtx.createBuffer(1,f.length,rate);b.copyToChannel(f,0);const s=audioCtx.createBufferSource();s.buffer=b;s.connect(audioCtx.destination);const at=Math.max(audioCtx.currentTime+.01,next);s.start(at);next=at+b.duration;sources.add(s);s.onended=()=>sources.delete(s)}
function handle(m){if(m.type==='observer.ready'){meta.textContent='OBS 已连接 · 等待实时会话'}else if(m.type==='ready'){card.classList.remove('offline');const voice=m.voice_profile?` · 音色 ${m.voice_profile}`:'';meta.textContent=`${m.provider}${voice} · ${m.episode_id.slice(0,8)}`}else if(m.type==='state'){orb.className='orb '+m.state;stateEl.textContent=labels[m.state]||m.state}else if(m.type==='transcript'&&m.role==='assistant'&&m.text){line.textContent=m.text}else if(m.type==='playback.clear'){clearAudio()}else if(m.type==='ended'){card.classList.add('offline');stateEl.textContent='通话结束'}}
async function connect(){try{const t=await ticket(),proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}${base}/observe?ticket=${encodeURIComponent(t)}`);ws.binaryType='arraybuffer';ws.onmessage=e=>typeof e.data==='string'?handle(JSON.parse(e.data)):play(e.data);ws.onclose=()=>setTimeout(connect,1200)}catch{setTimeout(connect,1600)}}
document.body.addEventListener('click',()=>audioCtx?.resume());connect();
</script></body></html>

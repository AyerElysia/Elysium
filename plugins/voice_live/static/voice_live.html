<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>爱莉实时通话</title>
<style>
:root{color-scheme:dark;--bg:#090b13;--panel:#121625;--line:#26304c;--text:#eef2ff;--muted:#8590ad;--blue:#83aaff;--green:#80d9ac;--gold:#f0ca84;--red:#ff8ca1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#17203a 0,var(--bg) 58%);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif}.shell{width:min(760px,calc(100vw - 32px));display:grid;gap:18px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;letter-spacing:.08em}.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px}.stage{background:linear-gradient(145deg,rgba(20,26,44,.95),rgba(10,13,24,.95));border:1px solid var(--line);border-radius:28px;min-height:330px;display:grid;place-items:center;position:relative;overflow:hidden}.halo{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(131,170,255,.17),transparent 68%);transform:scale(.8);transition:.35s}.orb{width:162px;height:162px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#46567d 0,#212b48 36%,#0c1020 74%);border:2px solid #53617f;box-shadow:0 18px 70px rgba(0,0,0,.45);position:relative;transition:.25s}.orb::after{content:"";position:absolute;inset:15px;border:1px solid rgba(255,255,255,.1);border-radius:50%}.orb.listening{border-color:var(--green);box-shadow:0 0 60px rgba(128,217,172,.22)}.orb.thinking{border-color:var(--gold);box-shadow:0 0 60px rgba(240,202,132,.2)}.orb.speaking{border-color:var(--blue);box-shadow:0 0 75px rgba(131,170,255,.34);animation:pulse 1.2s ease-in-out infinite}.orb.error{border-color:var(--red)}@keyframes pulse{50%{transform:scale(1.045)}}.state{font-size:14px;color:#dbe4ff;z-index:2}.meter{position:absolute;bottom:24px;width:180px;height:3px;background:#242b3d;border-radius:8px;overflow:hidden}.meter>i{display:block;width:0;height:100%;background:var(--green);transition:width .06s linear}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:13px;background:#171d2f;color:var(--text);padding:11px 18px;font-size:14px;cursor:pointer}button.primary{background:#dbe5ff;color:#111827;border-color:#dbe5ff}button.danger{color:#ffd7de;border-color:#633443}button:disabled{opacity:.4;cursor:not-allowed}.panel{display:grid;grid-template-columns:1fr auto;gap:12px;background:rgba(18,22,37,.84);border:1px solid var(--line);border-radius:18px;padding:14px}.transcript{height:144px;overflow:auto;font-size:13px;line-height:1.65}.empty{color:var(--muted)}.msg{margin:0 0 7px}.msg.user{color:#b9efd2}.msg.assistant{color:#c8d8ff}.msg.system{color:var(--muted)}.stats{min-width:170px;border-left:1px solid var(--line);padding-left:14px;font:12px/1.8 ui-monospace,SFMono-Regular,Consolas;color:var(--muted)}.stats b{color:var(--text);font-weight:500}@media(max-width:620px){.panel{grid-template-columns:1fr}.stats{border-left:0;border-top:1px solid var(--line);padding:10px 0 0}.stage{min-height:290px}}
</style>
</head>
<body>
<main class="shell">
  <div class="top"><div class="title">ELYSIA · LIVE VOICE</div><div class="badge" id="connection">未连接</div></div>
  <section class="stage">
    <div class="halo"></div>
    <div class="orb" id="orb"><span class="state" id="state">待机</span></div>
    <div class="meter"><i id="meter"></i></div>
  </section>
  <div class="controls">
    <button class="primary" id="start">开始通话</button>
    <button id="mute" disabled>静音麦克风</button>
    <button id="interrupt" disabled>现在听我说</button>
    <button class="danger" id="stop" disabled>结束</button>
  </div>
  <section class="panel">
    <div class="transcript" id="transcript"><div class="empty">最终转写和运行状态会显示在这里。</div></div>
    <div class="stats">
      <div>Provider <b id="provider">—</b></div>
      <div>音色 <b id="voiceProfile">原生</b></div>
      <div>SVC 块延迟 <b id="svcLatency">—</b></div>
      <div>Episode <b id="episode">—</b></div>
      <div>RTT <b id="latency">—</b></div>
      <div>上行 <b id="uplink">0 KB</b></div>
      <div>下行 <b id="downlink">0 KB</b></div>
      <div>音频序列 <b id="sequence">—</b></div>
    </div>
  </section>
</main>
<script>
const TARGET_RATE=16000,FRAME_MS=20,HEADER_BYTES=16;
const el=id=>document.getElementById(id),labels={idle:'待机',connecting:'连接模型',listening:'正在听',thinking:'正在思考',speaking:'正在说话',interrupted:'已打断',error:'发生错误',closed:'已结束'};
let ws=null,audioCtx=null,stream=null,micSource=null,worklet=null,silentGain=null,audioGeneration=0,running=false,explicitStop=false,muted=false,inputSeq=0,outputSeq=0,uplink=0,downlink=0,nextPlayTime=0,activeSources=new Set(),playbackStartedAt=0,episodeId='',reconnects=0,pingAt=0,bargeLatched=false,noiseFloor=.004,speechFrames=0,partial={};
const pathBase=location.pathname.replace(/\/$/,'');

function state(value){el('orb').className='orb '+value;el('state').textContent=labels[value]||value}
function status(text){el('connection').textContent=text}
function add(role,text,final=true){
  if(!text)return;const box=el('transcript');box.querySelector('.empty')?.remove();
  if(!final){let node=partial[role];if(!node){node=document.createElement('div');node.className='msg '+role;box.append(node);partial[role]=node}node.textContent=(role==='assistant'?'爱莉：':'你：')+((node.dataset.raw||'')+text);node.dataset.raw=(node.dataset.raw||'')+text}
  else{let node=partial[role];if(node){node.textContent=(role==='assistant'?'爱莉：':'你：')+text;delete partial[role]}else{node=document.createElement('div');node.className='msg '+role;node.textContent=(role==='assistant'?'爱莉：':role==='user'?'你：':'')+text;box.append(node)}}box.scrollTop=box.scrollHeight
}
function metrics(){el('uplink').textContent=(uplink/1024).toFixed(1)+' KB';el('downlink').textContent=(downlink/1024).toFixed(1)+' KB';el('sequence').textContent=outputSeq||'—'}
function clearPlayback(reason='interrupt'){
  for(const source of activeSources){try{source.stop()}catch{}}activeSources.clear();nextPlayTime=audioCtx?audioCtx.currentTime+.015:0;playbackStartedAt=0;if(reason)add('system','播放已立即清空：'+reason)
}
function playedMs(){return playbackStartedAt&&audioCtx?Math.max(0,Math.round((audioCtx.currentTime-playbackStartedAt)*1000)):0}
function sendInterrupt(source='manual'){if(!ws||ws.readyState!==WebSocket.OPEN||!running)return;const ms=playedMs();clearPlayback(source);ws.send(JSON.stringify({type:'interrupt',played_audio_ms:ms,source}))}

function packPCM(float32){
  const buf=new ArrayBuffer(HEADER_BYTES+float32.length*2),view=new DataView(buf);view.setUint8(0,86);view.setUint8(1,76);view.setUint8(2,49);view.setUint8(3,0);view.setUint32(4,++inputSeq,true);view.setUint32(8,TARGET_RATE,true);view.setUint32(12,0,true);for(let i=0;i<float32.length;i++){const v=Math.max(-1,Math.min(1,float32[i]));view.setInt16(HEADER_BYTES+i*2,v<0?v*32768:v*32767,true)}return buf
}
function handleMicFrame(samples,rms){
  el('meter').style.width=Math.min(100,rms*900)+'%';noiseFloor=rms<noiseFloor*3?noiseFloor*.985+rms*.015:noiseFloor;const threshold=Math.max(.009,noiseFloor*3.2);speechFrames=rms>threshold?speechFrames+1:0;
  if(activeSources.size&&speechFrames>=3&&!bargeLatched){bargeLatched=true;sendInterrupt('本地抢话检测')}if(rms<threshold&&speechFrames===0)bargeLatched=false;
  if(!running||muted||!ws||ws.readyState!==WebSocket.OPEN)return;const frame=packPCM(samples);uplink+=frame.byteLength;ws.send(frame);metrics()
}
async function startAudio(){
  await stopAudio();const generation=++audioGeneration;
  const nextStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  if(generation!==audioGeneration){nextStream.getTracks().forEach(t=>t.stop());return 0}
  const nextContext=new AudioContext({latencyHint:'interactive'});await nextContext.resume();
  const code=`class VoicePCM extends AudioWorkletProcessor{constructor(o){super();this.target=o.processorOptions.targetRate;this.frame=o.processorOptions.frameSamples;this.src=[];this.phase=0;this.out=[]}process(inputs){const input=inputs[0]&&inputs[0][0];if(!input)return true;for(const x of input)this.src.push(x);const ratio=sampleRate/this.target;while(this.phase+1<this.src.length){const i=Math.floor(this.phase),f=this.phase-i;this.out.push(this.src[i]*(1-f)+this.src[i+1]*f);this.phase+=ratio;if(this.out.length===this.frame){const data=new Float32Array(this.out),rms=Math.sqrt(data.reduce((s,v)=>s+v*v,0)/data.length);this.port.postMessage({data,rms},[data.buffer]);this.out=[]}}const used=Math.floor(this.phase);if(used){this.src.splice(0,used);this.phase-=used}return true}}registerProcessor('voice-pcm',VoicePCM)`;
  const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));try{await nextContext.audioWorklet.addModule(url)}finally{URL.revokeObjectURL(url)}
  if(generation!==audioGeneration){nextStream.getTracks().forEach(t=>t.stop());await nextContext.close();return 0}
  const nextWorklet=new AudioWorkletNode(nextContext,'voice-pcm',{processorOptions:{targetRate:TARGET_RATE,frameSamples:TARGET_RATE*FRAME_MS/1000}}),nextGain=nextContext.createGain(),nextSource=nextContext.createMediaStreamSource(nextStream);nextGain.gain.value=0;
  stream=nextStream;audioCtx=nextContext;worklet=nextWorklet;silentGain=nextGain;micSource=nextSource;
  nextWorklet.port.onmessage=e=>{if(generation===audioGeneration&&worklet===nextWorklet)handleMicFrame(e.data.data,e.data.rms)};
  nextSource.connect(nextWorklet).connect(nextGain).connect(nextContext.destination);return generation
}
async function stopAudio(){
  audioGeneration++;clearPlayback('');const oldContext=audioCtx;audioCtx=null;nextPlayTime=0;playbackStartedAt=0;
  if(worklet){worklet.port.onmessage=null;try{worklet.port.close()}catch{}worklet.disconnect();worklet=null}
  if(micSource){micSource.disconnect();micSource=null}if(silentGain){silentGain.disconnect();silentGain=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(oldContext&&oldContext.state!=='closed'){try{await oldContext.close()}catch{}}
}

function playFrame(buffer){
  const view=new DataView(buffer);if(buffer.byteLength<HEADER_BYTES||view.getUint8(0)!==86||view.getUint8(1)!==76||view.getUint8(2)!==49)throw new Error('不支持的音频帧');const seq=view.getUint32(4,true),rate=view.getUint32(8,true);if(outputSeq&&seq!==outputSeq+1)add('system',`下行音频序列跳跃 ${outputSeq} → ${seq}`);outputSeq=seq;const pcm=new Int16Array(buffer,HEADER_BYTES),floats=new Float32Array(pcm.length);for(let i=0;i<pcm.length;i++)floats[i]=pcm[i]/32768;const audio=audioCtx.createBuffer(1,floats.length,rate);audio.copyToChannel(floats,0);const source=audioCtx.createBufferSource();source.buffer=audio;source.connect(audioCtx.destination);const start=Math.max(audioCtx.currentTime+.012,nextPlayTime||0);if(!playbackStartedAt)playbackStartedAt=start;source.start(start);nextPlayTime=start+audio.duration;activeSources.add(source);source.onended=()=>{activeSources.delete(source);if(!activeSources.size)playbackStartedAt=0};downlink+=buffer.byteLength;metrics()
}

async function getTicket(){const response=await fetch(pathBase+'/ticket',{method:'POST',cache:'no-store'});if(!response.ok)throw new Error('无法取得安全连接 ticket');return(await response.json()).ticket}
async function connect(resume='',generation=audioGeneration){
  const ticket=await getTicket();if(generation!==audioGeneration||explicitStop)return;const proto=location.protocol==='https:'?'wss:':'ws:',socket=new WebSocket(`${proto}//${location.host}${pathBase}/ws?ticket=${encodeURIComponent(ticket)}`);ws=socket;socket.binaryType='arraybuffer';const current=()=>generation===audioGeneration&&ws===socket;
  socket.onopen=()=>{if(!current())return;status('安全连接已建立');socket.send(JSON.stringify({type:'start',resume_episode_id:resume}))};
  socket.onmessage=event=>{if(!current())return;try{if(typeof event.data==='string')handle(JSON.parse(event.data));else playFrame(event.data)}catch(error){add('system','数据处理错误：'+error.message)}};
  socket.onerror=()=>{if(current())status('连接错误')};socket.onclose=()=>{if(!current())return;ws=null;status('已断开');if(running&&!explicitStop&&reconnects<3){reconnects++;setTimeout(()=>connect(episodeId,generation),400*reconnects)}else if(!explicitStop)void finish(false)};
  function handle(msg){
    if(msg.type==='ready'){running=true;reconnects=0;episodeId=msg.episode_id;sessionStorage.setItem('voiceLiveEpisode',episodeId);el('provider').textContent=msg.provider;el('voiceProfile').textContent=msg.voice_profile||'原生';el('episode').textContent=episodeId.slice(0,8);status('通话中');state('listening')}
    else if(msg.type==='state')state(msg.state)
    else if(msg.type==='transcript')add(msg.role,msg.text,msg.is_final)
    else if(msg.type==='playback.clear')clearPlayback(msg.reason||'上游打断')
    else if(msg.type==='metrics'){const svc=msg.values?.voice_conversion;if(svc){const perBlock=svc.block_count?svc.inference_ms/svc.block_count:0;el('svcLatency').textContent=svc.block_count?Math.round(perBlock)+' ms':'缓冲中'}}
    else if(msg.type==='pong'){el('latency').textContent=Math.round(performance.now()-pingAt)+' ms'}
    else if(msg.type==='error'){add('system','错误：'+msg.message);state('error');if(msg.fatal)void finish(false)}
    else if(msg.type==='ended'){add('system','通话结束：'+msg.reason);void finish(false)}
  }
}
async function begin(){
  explicitStop=false;episodeId='';reconnects=0;inputSeq=0;outputSeq=0;uplink=0;downlink=0;el('transcript').innerHTML='<div class="empty">正在建立实时音频链路…</div>';el('start').disabled=true;el('stop').disabled=false;el('mute').disabled=false;el('interrupt').disabled=false;state('connecting');status('请求麦克风');try{const generation=await startAudio();if(generation&&generation===audioGeneration&&!explicitStop)await connect('',generation)}catch(error){add('system','启动失败：'+error.message);void finish(false)}
}
async function finish(sendStop=true){if(explicitStop&&!running&&!ws)return;explicitStop=true;running=false;if(sendStop&&ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'stop'}));try{ws?.close()}catch{}ws=null;el('start').disabled=true;el('stop').disabled=true;el('mute').disabled=true;el('interrupt').disabled=true;await stopAudio();el('start').disabled=false;state('idle');status('未连接')}
el('start').onclick=begin;el('stop').onclick=()=>void finish(true);el('interrupt').onclick=()=>sendInterrupt();el('mute').onclick=()=>{muted=!muted;el('mute').textContent=muted?'恢复麦克风':'静音麦克风'};
setInterval(()=>{if(ws?.readyState===WebSocket.OPEN){pingAt=performance.now();ws.send(JSON.stringify({type:'ping'}))}},5000);
window.addEventListener('beforeunload',()=>void finish(true));
</script>
</body>
</html>

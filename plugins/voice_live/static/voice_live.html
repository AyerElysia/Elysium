<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Live - 语音通话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f0f1a;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
  padding: 2rem;
  width: 100%;
  max-width: 600px;
}
h1 { font-size: 1.5rem; color: #89b4fa; font-weight: 500; }

/* 状态球体 */
.orb-wrapper { position: relative; width: 200px; height: 200px; }
.orb {
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #2a2a4a, #1a1a2e);
  border: 2px solid #333;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.orb.listening { border-color: #a6e3a1; box-shadow: 0 0 30px rgba(166,227,161,0.3); }
.orb.thinking { border-color: #f9e2af; box-shadow: 0 0 30px rgba(249,226,175,0.3); }
.orb.speaking { border-color: #89b4fa; box-shadow: 0 0 30px rgba(137,180,250,0.4); }
.orb.error { border-color: #f38ba8; box-shadow: 0 0 30px rgba(243,139,168,0.3); }
.orb-label { font-size: 0.9rem; color: #888; z-index: 1; }

/* 波形动画 */
.wave {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 0%; background: rgba(137,180,250,0.15);
  transition: height 0.2s ease;
}
.orb.speaking .wave { height: 40%; animation: waveAnim 1s ease-in-out infinite; }
.orb.listening .wave { height: 20%; background: rgba(166,227,161,0.15); }
@keyframes waveAnim {
  0%,100% { height: 30%; } 50% { height: 50%; }
}

/* 控制按钮 */
.controls { display: flex; gap: 1rem; align-items: center; }
.btn {
  padding: 0.8rem 2rem;
  border: none; border-radius: 2rem;
  font-size: 1rem; cursor: pointer;
  transition: all 0.2s;
}
.btn-start { background: #a6e3a1; color: #1a1a2e; }
.btn-start:hover { background: #94d38f; transform: scale(1.05); }
.btn-stop { background: #f38ba8; color: #1a1a2e; }
.btn-stop:hover { background: #e07a96; transform: scale(1.05); }
.btn-mute { background: #45475a; color: #e0e0e0; padding: 0.8rem 1.2rem; }
.btn-mute.active { background: #f9e2af; color: #1a1a2e; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* 模式选择 */
.mode-select {
  display: flex; gap: 0.5rem; align-items: center;
  font-size: 0.85rem; color: #888;
}
.mode-select select {
  background: #1e1e2e; color: #e0e0e0;
  border: 1px solid #444; border-radius: 0.5rem;
  padding: 0.4rem 0.8rem; font-size: 0.85rem;
}

/* 转写面板 */
.transcript {
  width: 100%; max-height: 200px;
  overflow-y: auto; padding: 1rem;
  background: #1e1e2e; border-radius: 1rem;
  border: 1px solid #333;
  font-size: 0.85rem; line-height: 1.6;
}
.transcript:empty::before { content: '通话记录将显示在这里...'; color: #555; }
.msg { margin-bottom: 0.5rem; }
.msg-user { color: #a6e3a1; }
.msg-assistant { color: #89b4fa; }
.msg-system { color: #666; font-style: italic; }

/* 状态栏 */
.status-bar {
  font-size: 0.75rem; color: #555;
  display: flex; gap: 1rem;
}
</style>
</head>
<body>
<div class="container">
  <h1>🎙️ Voice Live</h1>

  <div class="orb-wrapper">
    <div class="orb" id="orb">
      <div class="wave"></div>
      <span class="orb-label" id="orbLabel">待机</span>
    </div>
  </div>

  <div class="mode-select">
    <span>模式:</span>
    <select id="modeSelect">
      <option value="auto">自动</option>
      <option value="full_duplex">全双工</option>
      <option value="degraded">降级</option>
    </select>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="btnStart">开始通话</button>
    <button class="btn btn-mute" id="btnMute" disabled>🔇</button>
    <button class="btn btn-stop" id="btnStop" disabled>结束</button>
  </div>

  <div class="transcript" id="transcript"></div>

  <div class="status-bar">
    <span id="statusMode">模式: -</span>
    <span id="statusProvider">Provider: -</span>
    <span id="statusLatency">延迟: -</span>
  </div>
</div>

<script>
const SAMPLE_RATE = 16000;
const CHUNK_MS = 100;
const CHUNK_SIZE = SAMPLE_RATE * 2 * CHUNK_MS / 1000; // bytes per chunk

let ws = null;
let audioCtx = null;
let mediaStream = null;
let scriptNode = null;
let isMuted = false;
let isRunning = false;
let playbackQueue = [];
let isPlaying = false;

const orb = document.getElementById('orb');
const orbLabel = document.getElementById('orbLabel');
const btnStart = document.getElementById('btnStart');
const btnStop = document.getElementById('btnStop');
const btnMute = document.getElementById('btnMute');
const transcript = document.getElementById('transcript');
const modeSelect = document.getElementById('modeSelect');

// 状态映射
const STATE_LABELS = {
  idle: '待机', listening: '聆听中...', thinking: '思考中...',
  speaking: '说话中...', connecting: '连接中...', error: '错误'
};

function setState(state) {
  orb.className = 'orb ' + state;
  orbLabel.textContent = STATE_LABELS[state] || state;
}

function addTranscript(role, text) {
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  const prefix = role === 'user' ? '🧑 ' : role === 'assistant' ? '💜 ' : '⚙️ ';
  div.textContent = prefix + text;
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
}

// ============ WebSocket ============

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/voice-live/ws`;
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    addTranscript('system', '已连接，正在启动...');
    ws.send(JSON.stringify({ type: 'start', mode: modeSelect.value }));
  };

  ws.onmessage = (evt) => {
    if (typeof evt.data === 'string') {
      handleJsonMessage(JSON.parse(evt.data));
    } else {
      handleAudioFrame(evt.data);
    }
  };

  ws.onclose = () => {
    if (isRunning) {
      addTranscript('system', '连接断开');
      stopCall();
    }
  };

  ws.onerror = () => addTranscript('system', '连接错误');
}

function handleJsonMessage(msg) {
  switch (msg.type) {
    case 'ready':
      isRunning = true;
      document.getElementById('statusMode').textContent = '模式: ' + msg.mode;
      document.getElementById('statusProvider').textContent = 'Provider: ' + msg.provider;
      addTranscript('system', `就绪 (${msg.mode})`);
      setState('listening');
      break;
    case 'state':
      setState(msg.state);
      break;
    case 'transcript':
      if (msg.text) addTranscript(msg.role, msg.text);
      break;
    case 'audio_delta':
      // 音频元数据，下一帧是二进制
      break;
    case 'error':
      addTranscript('system', '错误: ' + msg.message);
      setState('error');
      break;
    case 'ended':
      addTranscript('system', '通话结束');
      stopCall();
      break;
  }
}

function handleAudioFrame(buffer) {
  // 将 PCM/OGG 数据加入播放队列
  playbackQueue.push(buffer);
  if (!isPlaying) playNext();
}

// ============ 音频播放 ============

async function playNext() {
  if (playbackQueue.length === 0) { isPlaying = false; return; }
  isPlaying = true;
  const data = playbackQueue.shift();

  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 尝试解码（OGG/WAV）
    const audioBuffer = await audioCtx.decodeAudioData(data.slice(0));
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioCtx.destination);
    source.onended = () => playNext();
    source.start();
  } catch (e) {
    // 如果解码失败（raw PCM），直接播放 PCM16
    playPCM16(data);
    setTimeout(playNext, 50);
  }
}

function playPCM16(buffer) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const int16 = new Int16Array(buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
  const audioBuffer = audioCtx.createBuffer(1, float32.length, 24000);
  audioBuffer.getChannelData(0).set(float32);
  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioCtx.destination);
  source.start();
}

// ============ 麦克风采集 ============

async function startMic() {
  mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: { sampleRate: SAMPLE_RATE, channelCount: 1, echoCancellation: true, noiseSuppression: true }
  });

  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
  const source = audioCtx.createMediaStreamSource(mediaStream);

  // ScriptProcessor 采集 PCM
  scriptNode = audioCtx.createScriptProcessor(4096, 1, 1);
  let pcmBuffer = new Int16Array(0);

  scriptNode.onaudioprocess = (e) => {
    if (isMuted || !ws || ws.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    // Float32 -> Int16
    const chunk = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      chunk[i] = Math.max(-32768, Math.min(32767, Math.round(input[i] * 32767)));
    }
    // 发送二进制帧
    ws.send(chunk.buffer);
  };

  source.connect(scriptNode);
  scriptNode.connect(audioCtx.destination);
}

function stopMic() {
  if (scriptNode) { scriptNode.disconnect(); scriptNode = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}

// ============ 控制 ============

async function startCall() {
  btnStart.disabled = true;
  btnStop.disabled = false;
  btnMute.disabled = false;
  setState('connecting');
  transcript.innerHTML = '';

  try {
    await startMic();
    connectWS();
  } catch (e) {
    addTranscript('system', '麦克风访问失败: ' + e.message);
    stopCall();
  }
}

function stopCall() {
  isRunning = false;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stop' }));
    ws.close();
  }
  ws = null;
  stopMic();
  playbackQueue = [];
  isPlaying = false;
  btnStart.disabled = false;
  btnStop.disabled = true;
  btnMute.disabled = true;
  setState('idle');
}

btnStart.onclick = startCall;
btnStop.onclick = stopCall;
btnMute.onclick = () => {
  isMuted = !isMuted;
  btnMute.textContent = isMuted ? '🔈' : '🔇';
  btnMute.classList.toggle('active', isMuted);
};
</script>
</body>
</html>

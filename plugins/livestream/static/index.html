<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Elysium Livestream Stage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" data-speaking="false">
    <section id="visual-slot" aria-label="Avatar composition slot">
      <div class="halo"></div>
      <div class="stage-mark">ELYSIUM</div>
      <div id="expression-label">舞台已待命</div>
    </section>
    <section id="subtitle" aria-live="polite"></section>
    <section id="audience-events" aria-label="Recent audience events"></section>
    <aside id="status-panel">
      <span id="status-dot"></span>
      <span id="status-text">正在连接舞台…</span>
    </aside>
    <nav id="controls" aria-label="Operator controls">
      <button id="start" disabled>手动开始</button>
      <button id="stop" disabled>停止</button>
      <button id="interrupt" disabled>打断</button>
      <input id="say-text" maxlength="1000" placeholder="经操作者确认后说一句话">
      <button id="say" disabled>发送</button>
    </nav>
  </main>
  <script src="app.js"></script>
</body>
</html>

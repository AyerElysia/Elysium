name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Static checks
        run: |
          uv run ruff check src plugins integrations scripts main.py --select E9,F63,F7,F82
          uv run python -m compileall -q src plugins scripts
          bash -n deploy.sh scripts/cleanup_leases.sh scripts/sync_job.sh

      - name: Run tests
        run: uv run python -m pytest -m "not slow"

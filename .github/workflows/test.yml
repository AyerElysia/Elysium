name: Tests

on:
  # 暂时禁用自动触发（测试依赖本地环境配置，CI 无法运行）
  # 待 CI 环境完善后恢复 push 触发
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -m "not slow" --cov-fail-under=40
